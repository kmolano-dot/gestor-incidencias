name: Pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: Pytest sobre Python ${{ matrix.version-python }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version-python: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestor_incidencias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestor_incidencias_test

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.version-python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version-python }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar las pruebas con cobertura
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=resultados-pruebas.xml

      - name: Guardar el registro de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pytest-${{ matrix.version-python }}
          path: |
            resultados-pruebas.xml
            coverage.xml
