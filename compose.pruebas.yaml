# Entorno de integracion continua para ejecutar las pruebas automatizadas.
# Levanta el servidor Jenkins y una base de datos exclusiva para las pruebas.
# Se mantiene separado de docker-compose.yaml para no afectar la base de desarrollo.
services:
  jenkins:
    build:
      context: ./jenkins
    container_name: gestor_incidencias_jenkins
    restart: unless-stopped
    # jenkins/security.groovy crea el usuario administrador con estas variables.
    # Compose se niega a arrancar si faltan en .env, para que Jenkins nunca
    # quede sin inicio de sesion.
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:?Define JENKINS_ADMIN_USER en el archivo .env}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Define JENKINS_ADMIN_PASSWORD en el archivo .env}
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - ci-net

  postgres-pruebas:
    image: postgres:16-alpine
    container_name: gestor_incidencias_db_pruebas
    restart: unless-stopped
    # Se expone el puerto para poder ejecutar las pruebas tambien en local.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: gestor_incidencias_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestor_incidencias_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ci-net

volumes:
  jenkins_home:

networks:
  ci-net:
